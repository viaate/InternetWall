      {label:'Quieter', act:'volume_down'},
      {label:'Louder', act:'volume_up'},
    ],
  },
  {
    key:'dyson', surface:'far', kind:'dyson', device:'dyson',
    /* TP07: 41.02in tall, 8.07in across. These are the manufacturer's figures, so this
       is the one object on the page already at exactly the right size. */
    xIn:74, bIn:0, wIn:8.07,
    name:'Dyson',
    sub:'TP07 purifying fan',
    note:'Talks MQTT on port 1883 on the LAN once it has been paired, which means real '
       + 'local control and real sensor readings rather than a cloud round trip.',
    on:false,
    controls:[
      {label:'On / off', act:'toggle'},
      {label:'Slower', act:'down'},
      {label:'Faster', act:'up'},
      {label:'Oscillate', act:'oscillate'},
    ],
  },

  /* ---------------- the near wall: the desk, running away to your left ---------------- */
  {
    key:'pc', surface:'near', kind:'tower', device:'pcs',
    /* Standing on the desk, so its bottom edge is the desk height. Mid tower: about
       18in tall and 8.3in across the front. */
    xIn:56, bIn:29, wIn:8.3, ratio:.46,
    name:'Gaming PC',
    sub:'on the desk, to your left',
    note:'Woken with a magic packet, which is a raw UDP broadcast to port 9. Browsers '
       + 'have no UDP at all, so this is the third thing the Pi is for. It works '
       + 'because the machine is on Ethernet; over wifi it mostly would not.',
    on:false,
    controls:[
      {label:'Wake', act:'wake_desktop'},
    ],
  },
];

/* Furniture, in the same inches. Not tappable and not controllable: it is here because
   a television floating over bare drywall with nothing beneath it reads as a rendering
   rather than as a room. */
const FURNITURE = [
  {surface:'far',  cls:'cube',  xIn:54, bIn:0,    wIn:18,   hIn:19.2},
  /* The doorway, north-east corner, beside the Dyson. A door is 32 x 80in, and having
     one real opening in the wall does more for the sense of a room than any amount of
     shading, because it is the one element with a size everybody already knows. */
  {surface:'far',  cls:'door',  xIn:84, bIn:0,    wIn:32,   hIn:80},
  {surface:'near', cls:'desk',  xIn:10, bIn:27.4, wIn:62,   hIn:1.8},
  {surface:'near', cls:'mon',   xIn:24, bIn:33,   wIn:23.5, hIn:13.5},
  {surface:'near', cls:'mon',   xIn:48, bIn:33,   wIn:23.5, hIn:13.5},
  {surface:'near', cls:'chair', xIn:30, bIn:0,    wIn:26,   hIn:34},
];

function objBody(o){
  const b = document.createElement('div');
  b.className = 'body';

  if (o.kind === 'tv'){
    b.innerHTML = '<div class="tv"><div class="spill"></div>'
                + '<div class="panel-glass" style="--ratio:' + (o.ratio || 1.777) + '">'
                + '<div class="art"></div><div class="sheen"></div></div></div>';
  } else if (o.kind === 'dyson'){
    b.innerHTML = '<div class="dyson"><div class="loop"><div class="flow"></div></div>'
                + '<div class="base"></div></div>';
  } else if (o.kind === 'ring'){
    b.innerHTML = '<div class="ring"></div>';
  } else if (o.kind === 'strip'){
    b.innerHTML = '<div class="strip"><div class="wash"></div><div class="line"></div></div>';
  } else if (o.kind === 'tower'){
    b.innerHTML = '<div class="tower"><div class="case" style="--ratio:' + (o.ratio || .46)
                + '"><div class="mesh"></div><div class="glow"></div>'
                + '<div class="accent"></div></div></div>';
  } else {
    b.innerHTML = '<div class="slabbox" style="--ratio:' + (o.ratio || 2.6) + '">'
                + '<div class="led"></div></div>';
  }
  return b;
}

/* An object's photograph, when there is one, replaces the drawn placeholder entirely
   rather than sitting inside it. Same decision as the two photographed frames on the
   wall page: a drawn bezel around a photographed bezel reads as two televisions. */
function buildObj(o){
  const el = document.createElement('div');
  el.className = 'obj ' + (o.bIn != null ? 'stood' : 'hung');
  el.dataset.key = o.key;
  el.style.setProperty('--x', rvw(o.xIn));
  el.style.setProperty('--w', rvw(o.wIn));

  el.style.bottom = rvw(BLEED_IN + FLOOR_IN + o.bIn);

  if (o.glow) el.style.setProperty('--glow', o.glow);
  if (o.on) el.classList.add('on');

  if (o.art){
    const img = document.createElement('img');
    img.src = o.art; img.alt = o.name; img.decoding = 'async';
    /* If the photograph is missing the drawn placeholder comes back, so a bad path can
       never leave a hole in the room. */
    img.addEventListener('error', () => img.replaceWith(objBody(o)));
    const wrap = document.createElement('div');
    wrap.className = 'body'; wrap.appendChild(img);
    el.appendChild(wrap);
  } else {
    el.appendChild(objBody(o));
  }

  el.addEventListener('click', () => { if (!swallowClick) openControl(o.key); });
  return el;
}

function buildRoom(){
  const far = $('#farWall'), near = $('#nearWall');
  const root = $('#room').style;
  root.setProperty('--cornerX', rvw(CORNER_IN));
  root.setProperty('--nearW',   rvw(NEAR_IN));
  root.setProperty('--bleed',   rvw(BLEED_IN));

  /* The floor and the baseboard belong to each surface rather than to the room, so
     that the near wall's floor is foreshortened by the same rotation as the near wall
     and the two meet at the corner instead of crossing it. */
  [far, near].forEach(s => {
    const b = document.createElement('div');
    b.className = 'base';
    b.style.setProperty('--baseB', rvw(BLEED_IN + FLOOR_IN));
    const f = document.createElement('div');
    f.className = 'floor';
    f.style.setProperty('--floorY', 'calc(100% - ' + rvw(BLEED_IN + FLOOR_IN) + ')');
    f.style.setProperty('--depth', rvw(ROOM_IN));
    s.appendChild(f); s.appendChild(b);
  });

  FURNITURE.forEach(f => {
    const d = document.createElement('div');
    d.className = 'furn ' + f.cls;
    d.style.left   = rvw(f.xIn);
    d.style.width  = rvw(f.wIn);
    d.style.height = rvw(f.hIn);
    d.style.bottom = rvw(BLEED_IN + FLOOR_IN + f.bIn);
    (f.surface === 'near' ? near : far).appendChild(d);
  });
  ROOM.forEach(o => (o.surface === 'near' ? near : far).appendChild(buildObj(o)));
}

function setObjState(key, on){
  const o = ROOM.find(x => x.key === key);
  if (!o) return;
  o.on = on;
  const el = $('#room [data-key="' + key + '"]');
  if (el) el.classList.toggle('on', on);
}

/* ---------------- talking to the bridge ----------------
   The iPad cannot reach any of these devices itself. Apple TV speaks a proprietary
   protocol, the Samsung serves wss with a self-signed certificate that Safari will
   not accept and offers no way to click past, and Wake-on-LAN is raw UDP which no
   browser has. So a Pi holds those connections and this posts JSON to it.

   It has to be https. The wall is served from GitHub Pages over https, and a secure
   page may not call an insecure one; there is no flag for that.

   Nothing here blocks the interface. The button changes state immediately and is put
   back if the bridge disagrees, because a wall panel that waits three seconds for a
   Pi before acknowledging a press feels broken even when it is working. */
let bridgeUp = null;

async function send(device, action){
  if (!cfg.bridge || !device) return false;
  try {
    const r = await fetch(cfg.bridge.replace(/\/$/, '') + '/cmd', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({device, action}),
    });
    bridgeUp = r.ok;
    return r.ok;
  } catch (e) {
    bridgeUp = false;
    return false;
  }
}

/* ---------------- an object's controls ---------------- */

let ctlKey = null;

function openControl(key){
  const o = ROOM.find(x => x.key === key);
  if (!o) return;
  ctlKey = key;
  $('#ctlName').textContent = o.name;
  $('#ctlSub').textContent = o.sub || '';
  $('#ctlNote').innerHTML = o.note || '';

  const box = $('#ctlKeys');
  box.textContent = '';
  if (!o.controls.length){
    const b = document.createElement('button');
    b.className = 'wide dead';
    b.textContent = 'Nothing wired to this yet';
    box.appendChild(b);
  }
  o.controls.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    if (o.controls.length % 2 === 1 && c === o.controls[o.controls.length - 1]){
      b.className = 'wide';                       // an odd last button spans, never orphans
    }
    b.addEventListener('click', () => runControl(o, c.act));
    box.appendChild(b);
  });

  $('#scrim').classList.add('on');
  $('#control').classList.add('on');
  resetIdle();
}

/* The state a control produces locally, so the room responds to a press whether or not
   there is a Pi on the other end. With a bridge configured this is an optimistic update
   that a failed call reverses; with no bridge it is the whole behaviour, which makes the
   page fully demonstrable before any hardware is wired. */
function localEffect(o, act){
  if (act === 'toggle' || act === 'power') return !o.on;
  if (['warm','cool','cyan','pink','up','down','oscillate','fan'].includes(act)) return true;
  if (act === 'wake_desktop') return true;
  return o.on;
}

const GLOWS = {warm:'#ffb46b', cyan:'#3fe0ff', pink:'#ff2e88'};

async function runControl(o, act){
  const before = o.on;
  const after = localEffect(o, act);
  if (GLOWS[act]){
    o.glow = GLOWS[act];
    const el = $('#room [data-key="' + o.key + '"]');
    if (el) el.style.setProperty('--glow', o.glow);
  }
  setObjState(o.key, after);

  if (!cfg.bridge || !o.device) return;
  const ok = await send(o.device, act);
  if (!ok) setObjState(o.key, before);           // the room did not actually change
}

function closeControl(){
  ctlKey = null;
  $('#control').classList.remove('on');
  $('#scrim').classList.remove('on');
}

$('#ctlDone').addEventListener('click', closeControl);

/* ====================== the pager ====================== */

const pagesEl = $('#pages');
let page = 0;

function setPage(n){
  page = Math.max(0, Math.min(1, n));
  pagesEl.style.setProperty('--page', page);
  $$('#dots i').forEach((d, i) => d.classList.toggle('on', i === page));
  resetIdle();
}

/* A page turn and a lean are the same gesture until they are not. The rule: a drag that
   is mostly horizontal and travels more than a third of the panel is a page turn;
   anything else was a look. Deciding on release rather than during means the lean still
   animates under the finger and the page only commits once. */
const PAGE_PX = () => innerWidth / 3;
let swipeFrom = null;

stage.addEventListener('pointerdown', e => {
  if (document.body.classList.contains('story-open')) return;
  if (idle) return;
  swipeFrom = {x:e.clientX, y:e.clientY};
});
addEventListener('pointerup', e => {
  if (!swipeFrom) return;
  const dx = e.clientX - swipeFrom.x, dy = e.clientY - swipeFrom.y;
  swipeFrom = null;
  if (Math.abs(dx) < PAGE_PX()) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.4) return;    // that was a vertical look
  setPage(page + (dx < 0 ? 1 : -1));
});
addEventListener('pointercancel', () => { swipeFrom = null; });

/* ====================== go ====================== */

loadCfg();
buildRoom();
setPage(0);
resetIdle();
</script>
</body>
</html>
