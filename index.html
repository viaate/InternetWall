<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Wall">
<link rel="apple-touch-icon" href="art/icon.png">
<link rel="icon" href="art/icon.png">
<meta name="robots" content="noindex">
<title>The Wall</title>

<!-- ======================================================================
     A wall-mounted iPad that pretends to be part of the wall next to it.

     Runs on an iPad Air 4 (A14, 1180x820pt landscape). Built and tested on an
     iPad Pro 11 M5, which is 1210x834. Under 1% different, so there is one
     fluid layout and no device branching anywhere in here.

     Two rules this file never breaks:

     1. NOTHING NAVIGATES. No <a href>, no location writes, no hash routing.
        Every view is a class on <body>. A navigation inside Guided Access is
        unrecoverable without unlocking the iPad, so there are simply no links:
        references to outside things are printed as text you type in yourself.

     2. NOTHING IS FETCHED. No CDN, no web font, no analytics, no YouTube embed.
        Everything is this file plus art/ and slab/. Works in airplane mode.

     The slab chapter data below is lifted verbatim from the slab site in the
     sibling repo. That copy was already written and already good; it is reused
     rather than rewritten.
     ====================================================================== -->

<style>
:root{
  /* --------------------------------------------------------------------
     THE ONLY LINE YOU ARE LIKELY TO WANT TO CHANGE.

     Sampled from the room photo and white-balanced against the ceiling and
     the door trim, which read as neutral. Three separate patches of wall all
     landed within one step of this, so it is a real measurement rather than
     a guess. It is still a measurement off a warm-lit phone photo, so treat it
     as a good starting point and not gospel. The settings panel (long-press
     bare wall) can nudge it live, and whatever you set there wins.
     -------------------------------------------------------------------- */
  --wall: #c6d1cf;

  --pink:#ff2e88;
  --yellow:#ffe600;
  --navy:#0b2e5b;
  --red:#e31837;
  --ink:#111;

  --ease:cubic-bezier(.2,.7,.25,1);

  /* Frames hang the same distance off the wall whatever size they are, so the
     shadow is one shared value in viewport units rather than per-piece. */
  --lift: .30vw;
  --cast: .95vw;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--wall);
  font:400 17px/1.55 Helvetica, Arial, sans-serif;
  color:var(--ink);
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;margin:0}

/* ============================ the wall ============================ */

/* ---------------- the room, and looking around it ----------------
   Drag and the camera shifts a little, the way it would if you leaned. The pieces stand
   proud of the wall on the z axis, so they slide against it rather than with it, which
   is the whole effect: parallax is what makes a flat panel read as depth.

   Depth is exaggerated. A frame really sits about an inch off a wall, which at this scale
   is under two points of travel at the angles used here, and invisible. Roughly four
   times life size is still small enough to look like a picture hanging on a wall and
   large enough to actually see.

   Only transform is animated, and only on one element, which is what keeps this cheap
   enough for the A14. */
#stage{
  position:fixed; inset:0;
  perspective:1500px;
  perspective-origin:calc(50% + var(--px, 0px)) calc(50% + var(--py, 0px));
}
#scene{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition:transform .55s var(--ease);
}
#scene.dragging{transition:none; will-change:transform}

#wall{
  /* Oversized, so tilting never swings a bare edge into shot. */
  position:absolute; inset:-8%;
  background-color:var(--wall);
  /* One baked tile. An feTurbulence filter here would be re-evaluated on every
     repaint of this layer, which on the A14 is a real cost for something that
     never changes. The tile is 512px shown at 256 so it lands 1:1 on device
     pixels of a 2x panel and is never resampled. */
  background-image:url(art/wall-texture.png);
  background-size:256px 256px;
  transition:opacity .9s var(--ease);
}
/* Broad undulation from the taping knife, plus the room's light falloff. Too
   large a feature to live in the tile without the repeat becoming obvious. */
#wall::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 85% at 32% 18%, rgba(255,255,255,.085), transparent 62%),
    radial-gradient(95% 70% at 88% 96%, rgba(0,0,0,.06), transparent 60%);
}

#plane{position:absolute; inset:0; transform-style:preserve-3d}

.piece{
  position:absolute;
  left:var(--x); width:var(--w);
  transition:transform .28s var(--ease), opacity .7s var(--ease);
  transform:translateZ(var(--z, 1.4vw));
}
/* Frames are placed by their top edge. Ledges are placed by their bottom edge, so
   the shelf line stays exactly where it was drilled no matter how tall whatever is
   standing on it turns out to be. Swapping a placeholder for a real photo of the
   loaded shelf then cannot move the shelf. */
/* A piece sets exactly one of --y or --b. Anything hung from the ceiling line uses --y;
   anything standing on, or lining up with, the shelf line uses --b, so the two stay
   locked together no matter what is on the shelf. */
.piece.frame,
.piece.photo{top:var(--y, auto); bottom:var(--b, auto)}
.piece.ledge{bottom:var(--b)}
.piece:active{transform:translateZ(var(--z, 1.4vw)) scale(.985)}

/* ---------------- a framed picture, drawn rather than photographed ----------------
   Moulding, mat, and a recessed opening. The whole illusion is three things:
   the mat is lighter than the moulding, the moulding casts a hard little shadow
   down onto the mat, and the print sits below the mat rather than on it. */
.moulding{
  padding:var(--mould, 5.4%);
  border-radius:1.5px;
  background:linear-gradient(157deg,#fff 0%,#faf9f5 34%,#efede5 72%,#e7e4da 100%);
  box-shadow:
    0 0 0 1px rgba(96,94,84,.34),
    inset 0 1.5px 0 rgba(255,255,255,.98),
    inset 0 -1.5px 0 rgba(0,0,0,.11),
    inset 1.5px 0 0 rgba(255,255,255,.55),
    inset -1.5px 0 0 rgba(0,0,0,.07),
    0 var(--lift) calc(var(--lift) * 1.6) rgba(42,48,42,.22),
    0 var(--cast) calc(var(--cast) * 2.1) rgba(42,48,42,.26);
}
.mat{
  padding:var(--matV, 10%) var(--matH, 10%);
  background:linear-gradient(162deg,#fdfdfa 0%,#f7f5ee 60%,#f1efe6 100%);
  box-shadow:inset 0 .18vw .34vw rgba(0,0,0,.16);
}
.opening{
  position:relative;
  aspect-ratio:var(--ratio, 1.25);
  overflow:hidden;
  background:#ddd;
  /* the cut edge of the mat board, lit from above */
  box-shadow:
    0 0 0 1px rgba(140,134,118,.55),
    inset 0 .22vw .42vw rgba(0,0,0,.42),
    inset 0 -.06vw .1vw rgba(255,255,255,.35);
}
.opening img{width:100%;height:100%;object-fit:cover}

/* Deep box frame for the card frame and the Shrek print: shallow mat, print sits
   further back, so the moulding is thinner and the opening shadow is stronger.
   Named .deep and not .box on purpose, because .box is the story panel's callout and
   when this was called .box the card frame inherited a 3px black border and a
   pink drop shadow from it. */
.piece.deep .mat{background:linear-gradient(160deg,#fcfcf9,#f2f0e8)}
/* Some pieces are photographs of the real frame, so they are shown whole and get only
   the wall shadow. Drawing a moulding around a photographed moulding reads as two
   frames, which is worse than either on its own. */
.piece.photo img{
  width:100%; height:auto; border-radius:1.5px;
  box-shadow:
    0 var(--lift) calc(var(--lift) * 1.6) rgba(42,48,42,.22),
    0 var(--cast) calc(var(--cast) * 2.1) rgba(42,48,42,.26);
}

.piece.deep .opening{box-shadow:
  0 0 0 1px rgba(140,134,118,.55),
  inset 0 .3vw .55vw rgba(0,0,0,.5),
  inset 0 -.06vw .1vw rgba(255,255,255,.3)}

/* ---------------- picture ledge ---------------- */
.ledge{--shelfh:1.53vw; --z:2.6vw}   /* an ~1.1in ledge lip at WALL_IN=72 */
.ledge .goods{
  display:flex; align-items:flex-end; justify-content:center;
  gap:.3vw; padding:0 .5vw;
  min-height:6vw;
}
/* Books keep their true size and lean on each other if the shelf is too short for them,
   which is what happens on a real ledge. Shrinking them to fit would have quietly broken
   the scale that the rest of this layout depends on. */
.ledge .goods img{flex:0 0 auto; margin-inline:calc(var(--squeeze, 0px) / -2)}
.ledge .goods img{
  height:var(--goods-h, 11vw); width:auto; max-width:none;
  align-self:flex-end;
  /* Standing on a shelf, lit from above: a tight contact shadow where the book meets
     the ledge, and a longer one falling back onto the wall behind. */
  box-shadow:
    0 .12vw .2vw rgba(30,36,30,.4),
    .12vw .5vw .9vw rgba(30,36,30,.3);
}
.ledge .goods{position:relative}
/* The slab is 4.62in tall against an 8.7in book, so it stands at 0.53 of the shelf's
   book height. It was eyeballed at .66 first, which made it taller than a real slab and
   left it looking like a small book rather than a cased card. */
.ledge .goods img.front{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  height:var(--front-h, 6vw); z-index:2;
  box-shadow:0 .1vw .18vw rgba(30,36,30,.45), .1vw .4vw .8vw rgba(30,36,30,.34);
}
.ledge .goods .frontTodo{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:2;
  height:var(--front-h, 6vw); aspect-ratio:.61;
  border:.2vw dashed rgba(60,66,58,.62); background:rgba(250,250,247,.94);
  display:flex; align-items:center; justify-content:center;
  font:700 clamp(8px,.72vw,12px)/1 Helvetica,Arial,sans-serif;
  color:rgba(38,44,38,.66); letter-spacing:.04em; text-transform:uppercase;
}
.ledge .shelf img{width:100%; height:100%; object-fit:fill; border-radius:0}
.ledge .shelf.hasphoto{background:none; box-shadow:
  0 var(--lift) calc(var(--lift)*1.6) rgba(42,48,42,.24),
  0 var(--cast) calc(var(--cast)*1.9) rgba(42,48,42,.24)}
.ledge .shelf{
  height:var(--shelfh);
  border-radius:0 0 2px 2px;
  background:linear-gradient(#fdfdfb 0 38%, #f2f1eb 38% 70%, #e6e4dc 100%);
  box-shadow:
    0 0 0 1px rgba(96,94,84,.3),
    inset 0 1px 0 rgba(255,255,255,.95),
    0 var(--lift) calc(var(--lift)*1.6) rgba(42,48,42,.24),
    0 var(--cast) calc(var(--cast)*1.9) rgba(42,48,42,.24);
}

/* Stand-in for an artifact whose photograph has not been taken yet. Deliberately
   plain and obviously provisional: a bad fake is worse than an honest gap, and
   this way nothing on the wall is ever pretending to be something it is not. */
.todo{
  aspect-ratio:var(--ratio, 1.25);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.35em; text-align:center; padding:.6em;
  border:.22vw dashed rgba(60,66,58,.42);
  border-radius:2px;
  background:rgba(255,255,255,.30);
  color:rgba(38,44,38,.66);
}
.todo b{font:700 clamp(9px,.86vw,15px)/1.2 Helvetica,Arial,sans-serif;letter-spacing:.02em}
.todo span{font:400 clamp(8px,.7vw,12px)/1.25 Helvetica,Arial,sans-serif;opacity:.8}
.ledge .todo{width:100%}

/* ============================ story panel ============================ */

#story{
  position:fixed; inset:0; z-index:40;
  background:#fff;
  transform:translateY(100%);
  transition:transform .42s var(--ease);
  display:flex; flex-direction:column;
  visibility:hidden;
}
body.story-open #story{transform:none; visibility:visible}

#storyTop{
  flex:0 0 auto; display:flex; align-items:flex-start; gap:1rem;
  padding:1.5rem 1.7rem 1.1rem; border-bottom:3px solid #000;
}
#storyTop .grow{flex:1 1 auto; min-width:0}
.stamp{
  display:inline-block; background:var(--pink); color:#fff;
  font:400 15px/1 Impact,"Arial Narrow Bold","Arial Black",Helvetica,sans-serif;
  letter-spacing:.06em; text-transform:uppercase;
  padding:.35rem .6rem .3rem; transform:rotate(-1.5deg); margin-bottom:.55rem;
}
.stamp.big{background:var(--red); font-size:19px}
#storyTop h1{
  margin:0; font:900 clamp(1.5rem,3.1vw,2.4rem)/1.02 "Arial Black",Helvetica,Arial,sans-serif;
  text-transform:uppercase; letter-spacing:-.02em;
}
#storyTop .facts{margin:.5rem 0 0; font-size:.9rem; color:#444}
#storyTop .facts b{color:#111}

.closebtn{
  flex:0 0 auto; width:3.4rem; height:3.4rem; border:3px solid #000;
  background:#fff; border-radius:0; cursor:pointer;
  font:700 1.6rem/1 Helvetica,Arial,sans-serif;
  box-shadow:4px 4px 0 var(--pink);
}
.closebtn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--pink)}

#storyBody{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:1.6rem 1.7rem 3rem;
}
#storyBody.two{
  display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:1.8rem; align-items:start;
}
.hero{border:3px solid #000; background:#000; overflow:hidden}
/* The books get their covers laid out instead of one photograph, aligned along the
   bottom so the shorter activity book sits on the same line as the rest. */
.heroRow{display:flex; align-items:flex-end; gap:.7rem}
.heroRow img{
  flex:1 1 0; min-width:0; height:auto; align-self:flex-end;
  border:3px solid #000;
  box-shadow:4px 4px 0 rgba(0,0,0,.14);
}
.hero img{width:100%; height:auto}
.prose{max-width:38rem}
.prose p{margin:0 0 .95rem}
.prose p:last-child{margin-bottom:0}
.prose .mark{background:var(--yellow); padding:0 .15em}

.box{
  border:3px solid #000; padding:1rem 1.1rem; margin:1.5rem 0 0;
  background:#fff; box-shadow:5px 5px 0 var(--pink);
}
.box.blue{box-shadow:5px 5px 0 var(--navy)}
.box h3{
  margin:0 0 .5rem;
  font:400 19px/1.15 Impact,"Arial Narrow Bold","Arial Black",Helvetica,sans-serif;
  letter-spacing:.04em; text-transform:uppercase;
}
.box p{margin:0 0 .6rem; font-size:.95rem}
.box p:last-child{margin-bottom:0}
.said{margin:1.2rem 0 0}
.said q{background:var(--yellow); padding:.1em .2em; font-style:italic}
.said cite{display:block; font-size:.82rem; color:#555; font-style:normal; margin-top:.35rem}

/* References are printed, never linked, because a tap that navigates would strand
   the kiosk outside the app. */
.ref{
  border-top:3px solid #000; margin-top:1.6rem; padding-top:.9rem;
  font-size:.86rem; color:#333;
}
.ref div{margin-bottom:.5rem}
.ref b{display:block; font-size:.9rem; color:#111}
.ref code{
  font:400 .82rem/1.4 ui-monospace,Menlo,Consolas,monospace;
  background:#f2f2ee; padding:.1em .3em; word-break:break-all;
}

/* A QR beats a printed URL here. The iPad cannot follow a link and nobody is going to
   retype a timestamped YouTube URL off a wall, but everyone already has the thing that
   reads these in their pocket. */
.qr{display:flex; gap:.85rem; align-items:flex-start; margin-bottom:1rem}
.qr img{
  width:6.4rem; height:6.4rem; flex:0 0 auto;
  border:2px solid #000; background:#fff; padding:.15rem;
}
.qr .lab{min-width:0; padding-top:.1rem}
.qr .lab b{display:block; font-size:.9rem; line-height:1.25}
.qr .lab span{
  display:block; margin-top:.25rem; color:#666;
  font:400 .78rem/1.35 ui-monospace,Menlo,Consolas,monospace; word-break:break-all;
}
.qr .lab em{display:block; margin-top:.2rem; font-size:.78rem; color:#888; font-style:normal}

/* ============================ the saga ============================ */

#storyBody.saga{max-width:none}
.saga-wrap{width:min(46rem,100%); margin-inline:auto}
.chapter{padding:0 0 2rem; border-bottom:3px solid #000; margin-bottom:2rem}
.chapter:last-child{border-bottom:0}
.chapter h2{margin:0; font:900 clamp(1.2rem,2.4vw,1.6rem)/1.1 Helvetica,Arial,sans-serif}
.chapter .facts{margin:.45rem 0 1rem; font-size:.88rem; color:#444}
.chapter .facts b{color:#111}

/* One <video> exists at a time. Eight of them alive at once is fine on the M5 and
   is a memory problem on the A14, which is exactly the class of bug the dev iPad hides.
   Each chapter shows a plate until tapped; the element is built on demand and the
   previous one is torn down. */
.plate{
  position:relative; border:4px solid #000; background:#111;
  aspect-ratio:16/9; width:100%; cursor:pointer; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.plate .tri{
  width:5.2rem; height:3.6rem; background:var(--red); border-radius:.7rem;
  display:flex; align-items:center; justify-content:center;
}
.plate .tri::after{
  content:""; border-style:solid; border-width:.75rem 0 .75rem 1.3rem;
  border-color:transparent transparent transparent #fff; margin-left:.25rem;
}
.plate:active .tri{background:var(--pink)}
.plate .cap{
  position:absolute; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.72); color:#fff;
  font:700 .82rem/1.3 Helvetica,Arial,sans-serif; padding:.45rem .6rem;
}
.frameV{border:4px solid #000; background:#000; display:flex; justify-content:center}
.frameV video{width:100%; height:auto; max-height:58vh}
.missing{
  border:4px dashed #000; padding:1.6rem 1.2rem; text-align:center;
  background:#fafaf7;
}
.missing b{display:block; font-size:1.02rem}
.missing span{font-size:.88rem; color:#444}
.gallery{display:grid; gap:.6rem; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.gallery img{width:100%; border:3px solid #000}

.scores{padding:0 0 2rem; border-bottom:3px solid #000; margin-bottom:2rem}
.scores .lede{font-size:.92rem; color:#444; margin:.3rem 0 1.1rem}
.bar{display:grid; grid-template-columns:4.6rem 1fr 2.6rem; align-items:center;
     gap:.5rem; margin-bottom:.4rem; font-size:.82rem}
.bar .who{text-align:right; color:#444; white-space:nowrap}
.bar .track{background:#f0f0f0; height:20px; border:1px solid #000; overflow:hidden}
/* display:block matters: an inline box ignores width, so the fill renders as nothing. */
.bar .fill{display:block; background:var(--pink); height:100%; width:0;
           transition:width .9s var(--ease)}
.bar.best .fill{background:var(--red)}
.bar .n{font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.guess{border:3px dashed #000; padding:1rem 1.1rem; margin:0 0 1.2rem}
.guess p{margin:0 0 .7rem; font-weight:700}
.guess .opts{display:flex; flex-wrap:wrap; gap:.4rem}
.guess button{
  font:700 .85rem Helvetica,Arial,sans-serif; padding:.45rem .75rem;
  background:#fff; border:2px solid #000; cursor:pointer;
}
.guess button.picked{background:var(--pink); color:#fff; border-color:var(--pink)}
.guess .verdict{margin:.9rem 0 0; font-weight:400}
.guess .verdict b{background:var(--yellow); padding:0 .15em}

/* ============================ idle ============================ */

/* The brief was "after 15 minutes it picks the brightness that looks most like it
   is not there and turns into the wall". Half of that is not possible: Safari has
   no API for screen brightness, and no web page can dim an iPad's backlight. What
   it can do is stop drawing anything and lay a calibrated scrim over the wall so
   the panel's luminance matches the real drywall beside it. Set --dim once by eye
   from the chair (long-press while idle) and it is saved. Pair it with iOS
   auto-brightness off, or the panel will drift away from your setting by itself. */
#dim{
  position:fixed; inset:0; z-index:60; pointer-events:none;
  background:#000; opacity:0;
  transition:opacity 1.6s var(--ease);
}
body.idle #dim{opacity:var(--dim,.34)}
body.idle #plane{opacity:0; pointer-events:none}
body.idle #wall::after{opacity:.5}

/* ============================ panels ============================ */

.panel{
  position:fixed; z-index:80; left:50%; top:50%;
  transform:translate(-50%,-50%) scale(.96);
  width:min(30rem,88vw);
  background:#fff; border:3px solid #000; box-shadow:8px 8px 0 var(--pink);
  padding:1.3rem 1.4rem; opacity:0; visibility:hidden;
  transition:opacity .2s var(--ease), transform .2s var(--ease), visibility .2s;
}
.panel.on{opacity:1; visibility:visible; transform:translate(-50%,-50%) scale(1)}
.panel h2{
  margin:0 0 .3rem;
  font:400 22px/1.1 Impact,"Arial Narrow Bold","Arial Black",Helvetica,sans-serif;
  letter-spacing:.04em; text-transform:uppercase;
}
.panel .hint{font-size:.84rem; color:#555; margin:0 0 1rem}
.row{margin:0 0 1rem}
.row label{display:block; font-weight:700; font-size:.85rem; margin-bottom:.35rem}
.row input[type=range]{width:100%}
.row input[type=color]{width:3.4rem; height:2.2rem; padding:0; border:2px solid #000;
                       background:#fff}
.row .inline{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
.swatches{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem}
.sw{
  width:2.5rem; height:2.5rem; border:2px solid #000; cursor:pointer; padding:0;
  position:relative;
}
.sw.on::after{content:"✓"; position:absolute; inset:0; display:flex;
              align-items:center; justify-content:center;
              font:700 1rem/1 Helvetica,Arial,sans-serif; color:#111;
              text-shadow:0 0 3px #fff,0 0 3px #fff}
.swname{font-size:.78rem; color:#555; margin-top:.4rem; min-height:1.1em}
.panel .go{display:flex; gap:.6rem; margin-top:1.2rem}
.panel .go button{
  flex:1; padding:.7rem; border:3px solid #000; background:#fff;
  font-weight:700; cursor:pointer;
}
.panel .go button.primary{background:var(--pink); color:#fff; border-color:var(--pink)}
.val{font-variant-numeric:tabular-nums; font-weight:700}

#scrim{
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.35);
  opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s;
}
#scrim.on{opacity:1; visibility:visible}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="stage"><div id="scene">
  <div id="wall"></div>
  <div id="plane"></div>
</div></div>

<div id="story" aria-hidden="true">
  <div id="storyTop">

   x / y / w are percentages of the panel. The height of a framed piece is

/* Everything below is in INCHES, not percentages, and that is the point.

   Sizing by eye is how the frames ended up about a third too large next to the shelves:
   a 14in picture and a 22in shelf were both just "some percentage of the panel", so
   there was nothing to check either against. Give a piece its real width and it lands at
   the right size relative to every other piece for free.

   WALL_IN is how much real wall the iPad is pretending to be. Raise it and everything
   shrinks together; the arrangement never distorts. */

   small in the panel, and the books and the slab were the pieces that suffered: a 6.7in
   book next to a 17in sign has nowhere to go once the sign is already small. Showing
   less wall keeps every ratio identical and makes the physical objects bigger on screen.

   than 60.3in, so 64 is close to as tight as the real furniture allows. */

   of its height for y, so the two axes would run at different scales and a 9in book and a
   9in gap would not be the same size. vw is one physical scale for both. */

/* ====================== small helpers ====================== */

const $ = s => document.querySelector(s);
const el = (t, cls, html) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

const byKey = k => PIECES.find(p => p.key === k);

/* ====================== settings ====================== */

const DEFAULTS = { wall:'#c6d1cf', dim:34, idleMin:15 };
let cfg = Object.assign({}, DEFAULTS);

function loadCfg(){
  try {
    const raw = localStorage.getItem('wall.cfg');
    if (raw) cfg = Object.assign({}, DEFAULTS, JSON.parse(raw));
  } catch (e) { /* private mode, or corrupt: defaults are fine */ }
  applyCfg();
}
function saveCfg(){
  try { localStorage.setItem('wall.cfg', JSON.stringify(cfg)); } catch (e) {}
}
function applyCfg(){
  document.documentElement.style.setProperty('--wall', cfg.wall);
  document.documentElement.style.setProperty('--dim', cfg.dim / 100);
}

/* ====================== build the wall ====================== */

const plane = $('#plane');

function artNode(src, ratio, label){
  /* An <img> that quietly becomes an honest placeholder if the file is not there
     yet, so the wall is never broken while photographs are still being taken. */
  const wrap = el('div', 'opening');
  if (ratio) wrap.style.setProperty('--ratio', ratio);
  const img = el('img');
  img.src = src;
  img.alt = label || '';
  img.decoding = 'async';
  img.addEventListener('error', () => {
    wrap.replaceWith(todoNode(ratio, label));
  });
  wrap.appendChild(img);
  return wrap;
}

function todoNode(ratio, label){
  const d = el('div', 'todo',
    '<b>' + esc(label || 'artwork') + '</b><span>photo not added yet</span>');
  if (ratio) d.style.setProperty('--ratio', ratio);
  return d;
}

function buildPiece(p){
  const node = el('div', 'piece ' + p.type + (p.deep ? ' deep' : ''));
  node.style.setProperty('--x', vw(p.xIn));
  node.style.setProperty('--w', vw(p.wIn));
  if (p.yIn != null) node.style.setProperty('--y', vw(p.yIn));
  if (p.bIn != null) node.style.setProperty('--b', vw(p.bIn));
  node.dataset.key = p.key;

  if (p.type === 'frame'){
    if (p.mould) node.style.setProperty('--mould', p.mould);
    /* Mat borders are wider on the long sides than the short ones, so the two are set
       separately. Uniform padding made the 11x14 frames an inch too tall. */
    if (p.matV) node.style.setProperty('--matV', p.matV);
    if (p.matH) node.style.setProperty('--matH', p.matH);
    const mould = el('div', 'moulding');
    const mat = el('div', 'mat');
    mat.appendChild(artNode(p.art, p.ratio, p.title));
    mould.appendChild(mat);
    node.appendChild(mould);

  } else if (p.type === 'photo'){
    /* Already a photograph of the real frame. It needs the wall shadow and nothing else. */
    const img = el('img');
    img.src = p.art;
    img.alt = p.title;
    img.decoding = 'async';
    img.addEventListener('error', () => img.replaceWith(todoNode(p.ratio || 1.4, p.title)));
    node.appendChild(img);

  } else {
    if (p.bookIn) node.style.setProperty('--goods-h', vw(p.bookIn));
    if (p.frontIn) node.style.setProperty('--front-h', vw(p.frontIn));
    const goods = el('div', 'goods');

    (p.goods || []).forEach(item => {
      /* A book is either a path, or a path plus a scale for anything that is not the
         same trim as the rest of the shelf. */
      const src = typeof item === 'string' ? item : item.src;
      const scale = typeof item === 'string' ? 1 : (item.scale || 1);
      const img = el('img');
      img.src = src;
      img.alt = '';
      img.decoding = 'async';
      if (scale !== 1) img.style.height = 'calc(var(--goods-h, 11vw) * ' + scale + ')';
      /* A cover that has not been scanned yet just is not on the shelf. A dashed box
         standing among real books looks far worse than a slightly emptier shelf. */
      img.addEventListener('error', () => img.remove());
      goods.appendChild(img);
    });

    if (p.front){
      const f = el('img', 'front');
      f.src = p.front;
      f.alt = p.frontStory ? 'The slab' : '';
      if (p.frontStory){
        f.style.cursor = 'pointer';
        f.addEventListener('click', e => {
          e.stopPropagation();       // or the shelf underneath opens as well
          openStory(p.frontStory);
        });
      }
      /* This one does get a marker when it is missing, because it is the slab and the whole
         point of that shelf, and it should not be quietly forgotten. */
      f.addEventListener('error', () => f.replaceWith(el('div', 'frontTodo', 'slab')));
      goods.appendChild(f);
    }

    node.appendChild(goods);

    const shelf = el('div', 'shelf');
    if (p.shelf){
      const si = el('img');
      si.src = p.shelf;
      si.alt = '';
      si.addEventListener('error', () => shelf.classList.remove('hasphoto'));
      shelf.classList.add('hasphoto');
      shelf.appendChild(si);
    }
    node.appendChild(shelf);
  }

  node.addEventListener('click', () => openStory(p.key));
  return node;
}

PIECES.filter(p => !p.virtual).forEach(p => plane.appendChild(buildPiece(p)));

/* ====================== the story panel ====================== */

let currentVideo = null;

function killVideo(){
  if (!currentVideo) return;
  const v = currentVideo;
  currentVideo = null;
  /* Flagged before teardown starts. Clearing src and calling load() makes the element
     fire `error`, and without this the handler below would take our own teardown for a
     broken file and stamp "this clip is not here" over a clip that is perfectly fine. */
  v.dataset.tearing = '1';
  /* Pausing alone is not enough. Clearing src and calling load() is what actually
     releases the decoder, which is the thing that matters on the A14 after a few clips. */
  try {
    v.pause();
    v.removeAttribute('src');
    v.load();
  } catch (e) {}
  v.remove();
}

function openStory(key){
  let p = byKey(key);
  if (!p) return;
  if (p.storyOf) p = byKey(p.storyOf) || p;

  $('#storyStamp').textContent = p.stamp || '';
  $('#storyTitle').textContent = p.title || '';
  $('#storyFacts').innerHTML = p.facts || '';

  const body = $('#storyBody');
  body.className = '';
  body.scrollTop = 0;
  body.replaceChildren();

  if (p.opensSaga){
    body.classList.add('saga');
    body.appendChild(buildSaga(p));
  } else {
    body.classList.add('two');
    /* A ledge has no single picture of its own: its artwork is the row of things standing
       on it. Reading p.art here left src as undefined, which fetched "/undefined", failed,
       and put a "photo not added yet" box on a story whose covers were all present. */
    const heroList = p.heroGoods || p.goods;
    if (heroList && heroList.length){
      const row = el('div', 'heroRow');
      heroList.forEach(item => {
        const src = typeof item === 'string' ? item : item.src;
        const scale = typeof item === 'string' ? 1 : (item.scale || 1);
        const i = el('img');
        i.src = src;
        i.alt = '';
        if (scale !== 1) i.style.width = (scale * 100) + '%';
        i.addEventListener('error', () => i.remove());
        row.appendChild(i);
      });
      body.appendChild(row);
    } else {
      const hero = el('div', 'hero');
      const img = el('img');
      img.src = p.art;
      img.alt = p.title;
      img.addEventListener('error', () => hero.replaceWith(todoNode(p.ratio || 1.4, p.title)));
      hero.appendChild(img);
      body.appendChild(hero);
    }

    const prose = el('div', 'prose');
    (p.body || []).forEach(t => prose.appendChild(el('p', null, t)));
    if (p.refs && p.refs.length){
      const r = el('div', 'ref');
      r.appendChild(el('div', null,
        '<b>Point your phone at these</b>' +
        '<span style="color:#666">, because this iPad deliberately cannot leave the app.</span>'));
      p.refs.forEach(x => r.appendChild(qrBlock(x.qr, x.b, x.u)));
      prose.appendChild(r);
    }
    body.appendChild(prose);
  }

  document.body.classList.add('story-open');
  $('#story').setAttribute('aria-hidden', 'false');
}

function closeStory(){
  killVideo();
  document.body.classList.remove('story-open');
  $('#story').setAttribute('aria-hidden', 'true');
}
$('#storyClose').addEventListener('click', closeStory);

/* ====================== the saga ====================== */

function buildSaga(p){
  const wrap = el('div', 'saga-wrap');

  const intro = el('div', 'prose');
  (p.body || []).forEach(t => intro.appendChild(el('p', null, t)));
  intro.appendChild(el('div', 'box',
    '<h3>Hang on, what is a slab?</h3>' +
    '<p>Collectors send valuable cards to a company called <b>PSA</b>. They check the card is ' +
    'genuine, grade its condition from 1 to 10, and seal it in a hard plastic case with a printed ' +
    'label on it. That sealed case is a slab.</p>' +
    '<p>The one on the shelf is not one of theirs. PSA will not authenticate a signature unless ' +
    'the signer is on their list of people worth authenticating, and Jack, staggeringly, is not ' +
    'on that list. So the case is homemade, the grade is invented, the serial number means ' +
    'nothing at all, and the signature is completely real, which I would argue is the only part ' +
    'that was ever going to matter.</p>'));
  intro.appendChild(el('div', 'box blue',
    '<h3>Wait, who is Jack?</h3>' +
    '<p><b>Jack Massey Welsh</b> posts as <b>JackSucksAtLife</b>. His second channel puts out a ' +
    'weekly video where he scrolls through his own fan subreddit and reacts to whatever people ' +
    'posted that week. That weekly video is the entire reason any of this happened.</p>' +
    '<p>There is no way to submit anything to him. You just have to post something good enough ' +
    'that it reaches the top that week.</p>'));
  wrap.appendChild(intro);

  const core = SAGA.filter(c => !['spoon','label'].includes(c.key));
  const extra = SAGA.filter(c => ['spoon','label'].includes(c.key));

  core.forEach((ch, i) => {
    wrap.appendChild(chapter(ch, i + 1, core.length));
    if (ch.key === 'finale') wrap.appendChild(scoreboard());
  });
  extra.forEach((ch, i) => wrap.appendChild(chapter(ch, i + 1, extra.length, true)));
  return wrap;
}

function chapter(ch, n, total, isExtra){
  const sec = el('section', 'chapter');
  const stampText = ch.key === 'finale' ? 'the finale'
                  : isExtra ? 'extra ' + n + ' of ' + total
                  : 'part ' + n + ' of ' + total;
  sec.appendChild(el('div', 'stamp' + (ch.finale ? ' big' : ''), esc(stampText)));
  sec.appendChild(el('h2', null, esc(ch.title)));

  let facts = esc(ch.date);
  if (typeof ch.score === 'number') facts += ' &nbsp;·&nbsp; <b>' + ch.score + '</b> upvotes';
  if (typeof ch.comments === 'number') facts += ' &nbsp;·&nbsp; <b>' + ch.comments + '</b> comments';
  sec.appendChild(el('p', 'facts', facts));

  if (ch.video){
    sec.appendChild(videoPlate(ch));
  } else if (ch.poster){
    const plate = el('div', 'plate');
    const img = el('img');
    img.src = ch.poster;
    img.alt = '';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;opacity:.8';
    img.addEventListener('error', () => img.remove());
    plate.appendChild(img);
    plate.appendChild(el('span', 'cap',
      'This one is on YouTube, and this iPad is offline on purpose'));
    sec.appendChild(plate);
  } else if (ch.label){
    const box = el('div', 'hero');
    const img = el('img'); img.src = ch.label; img.alt = 'The finished slab label.';
    img.addEventListener('error', () => box.replaceWith(missing('the label artwork')));
    box.appendChild(img);
    sec.appendChild(box);
  } else if (ch.photos){
    const g = el('div', 'gallery');
    let alive = 0;
    ch.photos.forEach(src => {
      const img = el('img'); img.src = src; img.loading = 'lazy'; img.alt = ch.title;
      img.addEventListener('error', () => { img.remove(); if (--alive === 0) g.replaceWith(missing('these photos')); });
      alive++; g.appendChild(img);
    });
    sec.appendChild(g);
  }

  sec.appendChild(el('p', null, esc(ch.body)));
  if (ch.quote){
    sec.appendChild(el('p', 'said',
      '<q>' + esc(ch.quote) + '</q><cite>' + esc(ch.quoteWho || '') + '</cite>'));
  }
  if (ch.box){
    sec.appendChild(el('div', 'box',
      '<h3>' + esc(ch.box.title) + '</h3><p>' + ch.box.html + '</p>'));
  }
  if (ch.jack && ch.jack.v){
    const label = ch.jackLabel || ('Jack’s reaction, from ' + mmss(ch.jack.t || 0));
    const r = el('div', 'ref');
    r.appendChild(qrBlock('jack-' + ch.key, label,
      'youtu.be/' + ch.jack.v + (ch.jack.t ? '?t=' + ch.jack.t : '')));
    sec.appendChild(r);
  }
  return sec;
}

/* The QR files are generated by src/build-assets.py from the same list of links, so a
   code can never drift out of step with the caption printed beside it. */
function qrBlock(key, label, shown){
  const wrap = el('div', 'qr');
  const img = el('img');
  img.src = 'art/qr/' + key + '.svg';
  img.alt = 'QR code for ' + label;
  img.addEventListener('error', () => img.remove());
  const lab = el('div', 'lab',
    '<b>' + esc(label) + '</b>' +
    (shown ? '<span>' + esc(shown) + '</span>' : '') +
    /* Only the codes that actually carry a ?t= land you at a moment. Saying it on the
       ones that open at 0:00 is just a small lie repeated fourteen times. */
    (shown && shown.indexOf('?t=') > -1 ? '<em>opens at the right moment</em>' : ''));
  wrap.append(img, lab);
  return wrap;
}

function missing(what){
  return el('div', 'missing',
    '<b>' + esc(what) + ' is not here</b><span>everything else still works</span>');
}

function videoPlate(ch){
  const plate = el('div', 'plate');
  plate.appendChild(el('span', 'tri'));
  plate.appendChild(el('span', 'cap', esc(ch.short) + ', tap to play, out loud'));
  plate.addEventListener('click', () => {
    killVideo();
    const holder = el('div', 'frameV');
    const v = document.createElement('video');
    v.src = ch.video;
    v.controls = true;
    v.preload = 'none';
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('aria-label', ch.title);
    /* Not muted, and started from a tap, which is the gesture iOS wants before it
       will let audio out. So no unmute step is ever shown to anybody. */
    v.addEventListener('error', () => {
      if (v.dataset.tearing) return;      // we caused this, it is not a fault
      holder.replaceWith(missing('this clip'));
    });
    holder.appendChild(v);
    plate.replaceWith(holder);
    currentVideo = v;
    v.play().catch(() => { /* left paused with controls: still usable */ });
  });
  return plate;
}

function scoreboard(){
  const rows = SAGA.filter(c => typeof c.score === 'number');
  const max = Math.max(...rows.map(c => c.score));
  const winner = rows.find(c => c.score === max);
  const sec = el('section', 'scores');

  sec.appendChild(el('div', 'stamp', 'the numbers'));
  sec.appendChild(el('h2', null, 'How each one actually did'));
  sec.appendChild(el('p', 'lede', 'Upvotes on Reddit, which was the only scoreboard that existed.'));

  const guess = el('div', 'guess',
    '<p>Before you look: which one do you reckon did best?</p><div class="opts">' +
    rows.map(c => '<button type="button" data-key="' + c.key + '">' +
      esc(CHART_NAME[c.key] || c.short) + '</button>').join('') +
    '<button type="button" data-key="_skip">just show me</button></div>' +
    '<p class="verdict" hidden></p>');
  sec.appendChild(guess);

  rows.forEach(c => {
    sec.appendChild(el('div', 'bar' + (c.score === max ? ' best' : ''),
      '<span class="who">' + esc(CHART_NAME[c.key] || c.short) + '</span>' +
      '<span class="track"><span class="fill" data-w="' +
        (c.score / max * 100).toFixed(1) + '"></span></span>' +
      '<span class="n">' + c.score + '</span>'));
  });

  let answered = false;
  const verdict = guess.querySelector('.verdict');
  const reveal = () => {
    if (answered) return;
    answered = true;
    sec.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
    sec.appendChild(el('p', 'lede',
      'My dad came last and we do not talk about it.'));
  };
  guess.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      const k = btn.dataset.key;
      if (k !== '_skip'){
        btn.classList.add('picked');
        const picked = rows.find(c => c.key === k);
        verdict.innerHTML = (k === winner.key)
          ? 'Correct. <b>' + esc(CHART_NAME[winner.key]) + '</b> won it with ' + winner.score + '.'
          : 'You said ' + esc(CHART_NAME[k]) + ', which got ' + picked.score +
            '. It was actually <b>' + esc(CHART_NAME[winner.key]) + '</b>, with ' + winner.score + '.';
        verdict.hidden = false;
      }
      reveal();
    });
  });
  return sec;
}

/* ====================== looking around ======================
   Drag anywhere on the wall and the camera leans. It springs back on release, because
   this is a wall, not a viewer: it should always settle to square-on so it goes back to
   pretending it is not a screen.

   The threshold is what keeps this from breaking tapping. Without it every tap would
   land as a one-pixel drag and then fire a story on release, or worse, a story would
   open at the end of a deliberate drag. Past 10px it is a drag and the click that
   follows is swallowed. */

const scene = $('#scene');
const stage = $('#stage');
const MAX_TILT = 7;          // degrees. More than this and the illusion breaks down.
const DRAG_PX = 10;

let dragFrom = null, dragging = false, swallowClick = false;

function setTilt(rx, ry){
  scene.style.setProperty('--rx', rx.toFixed(2) + 'deg');
  scene.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  /* Moving the vanishing point as well as rotating is what sells it as the viewer
     moving rather than the wall spinning on a spindle. */
  stage.style.setProperty('--px', (-ry * 5).toFixed(1) + 'px');
  stage.style.setProperty('--py', (rx * 5).toFixed(1) + 'px');
}

function tiltStart(e){
  /* Clear it here rather than trusting the click to arrive. A drag that ends off-screen,
     or on an element that never emits a click, would otherwise leave the flag armed and
     silently eat whichever real tap came next. A new gesture always starts clean. */
  swallowClick = false;
  if (document.body.classList.contains('story-open')) return;
  if (idle) return;                       // the first touch is for waking up
  dragFrom = {x:e.clientX, y:e.clientY};
  dragging = false;
}

function tiltMove(e){
  if (!dragFrom) return;
  const dx = e.clientX - dragFrom.x;
  const dy = e.clientY - dragFrom.y;
  if (!dragging){
    if (Math.hypot(dx, dy) < DRAG_PX) return;
    dragging = true;
    scene.classList.add('dragging');
  }
  const clamp = v => Math.max(-MAX_TILT, Math.min(MAX_TILT, v));
  /* Divisors are half the panel, so a drag from the middle to an edge reaches full tilt. */
  setTilt(clamp(dy / (innerHeight / 2) * -MAX_TILT),
          clamp(dx / (innerWidth / 2) * MAX_TILT));
}

function tiltEnd(){
  if (dragging) swallowClick = true;      // this gesture was a look, not a tap
  dragFrom = null;
  dragging = false;
  scene.classList.remove('dragging');
  setTilt(0, 0);
}

stage.addEventListener('pointerdown', tiltStart);
addEventListener('pointermove', tiltMove, {passive:true});
addEventListener('pointerup', tiltEnd);
addEventListener('pointercancel', tiltEnd);

/* Capture, so it is stopped before it reaches whichever piece is underneath. */
addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* ====================== idle ====================== */

let idleTimer = null;
let idle = false;

function goIdle(){
  if (idle) return;
  idle = true;
  closeStory();
  document.body.classList.add('idle');
}
function wake(){
  idle = false;
  document.body.classList.remove('idle');
  resetIdle();
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(goIdle, cfg.idleMin * 60 * 1000);
}

/* The tap that wakes the wall must not also open whatever it landed on, or every
   wake would fire a story at somebody who was only walking past. Capture phase,
   so it is swallowed before it reaches the piece. */
document.addEventListener('pointerdown', e => {
  if (idle){
    e.stopPropagation();
    e.preventDefault();
    wake();
    return;
  }
  resetIdle();
}, true);
['pointermove','wheel','keydown','touchstart'].forEach(t =>
  document.addEventListener(t, () => { if (!idle) resetIdle(); }, {passive:true}));

/* ====================== settings, on a long press ====================== */

let pressTimer = null;

function armLongPress(e){
  /* Only on bare wall or on the dim layer, so it can never be reached by mashing
     a picture, and it stays out of the way of anybody just looking at the thing. */
  const onWall = e.target.id === 'wall' || e.target.id === 'plane' || e.target.id === 'dim';
  if (!onWall) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(openSettings, 1400);
}
function disarm(){ clearTimeout(pressTimer); }
document.addEventListener('pointerdown', armLongPress);
['pointerup','pointercancel','pointermove'].forEach(t =>
  document.addEventListener(t, disarm));

function openSettings(){
  if (idle){ idle = false; document.body.classList.remove('idle'); }
  $('#setColor').value = cfg.wall;
  $('#setColorVal').textContent = cfg.wall.toUpperCase();
  $('#setDim').value = cfg.dim;
  $('#setDimVal').textContent = cfg.dim + '%';
  $('#setIdle').value = cfg.idleMin;
  $('#setIdleVal').textContent = cfg.idleMin + ' min';
  markSwatch();
  $('#settings').classList.add('on');
  $('#scrim').classList.add('on');
}
function closeSettings(){
  $('#settings').classList.remove('on');
  $('#scrim').classList.remove('on');
  document.body.classList.remove('idle');
  saveCfg();
  resetIdle();
}

const swBox = $('#swatches');
SWATCHES.forEach(([hex, name]) => {
  const b = el('button', 'sw');
  b.style.background = hex;
  b.dataset.hex = hex;
  b.title = name;
  b.addEventListener('click', () => {
    cfg.wall = hex;
    applyCfg();
    $('#setColor').value = hex;
    $('#setColorVal').textContent = hex.toUpperCase();
    $('#swName').textContent = name;
    markSwatch();
  });
  swBox.appendChild(b);
});
function markSwatch(){
  let found = '';
  swBox.querySelectorAll('.sw').forEach(b => {
    const hit = b.dataset.hex.toLowerCase() === cfg.wall.toLowerCase();
    b.classList.toggle('on', hit);
    if (hit) found = b.title;
  });
  $('#swName').textContent = found;
}

$('#setColor').addEventListener('input', e => {
  cfg.wall = e.target.value; applyCfg();
  $('#setColorVal').textContent = cfg.wall.toUpperCase();
  markSwatch();
});
$('#setDim').addEventListener('input', e => {
  cfg.dim = +e.target.value; applyCfg();
  $('#setDimVal').textContent = cfg.dim + '%';
});
$('#setIdle').addEventListener('input', e => {
  cfg.idleMin = +e.target.value;
  $('#setIdleVal').textContent = cfg.idleMin + ' min';
});
$('#setPreview').addEventListener('click', () => {
  /* Show the idle state behind the panel so the dim level can be judged against
     the actual wall next to the iPad, which is the only way to get it right. */
  document.body.classList.toggle('idle');
});
$('#setReset').addEventListener('click', () => {
  cfg = Object.assign({}, DEFAULTS); applyCfg(); openSettings();
});
$('#setDone').addEventListener('click', closeSettings);
$('#scrim').addEventListener('click', closeSettings);

/* ====================== offline ====================== */

/* iOS only runs a service worker over HTTPS or on localhost. Served off a PC on the LAN
   over plain http it simply never registers, and everything else still works, so this
   reports what is actually true rather than promising offline it cannot deliver. */
let swReg = null;

function offlineState(msg){ const n = $('#offlineState'); if (n) n.textContent = msg; }

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    offlineState('The wall and every photo are saved. Clips are saved as you play them.');
  }).catch(() => {
    offlineState('Could not register. Needs https, or localhost.');
    $('#setCache').disabled = true;
  });
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'cache-progress'){
      offlineState('Saving clip ' + d.done + ' of ' + d.total + '…');
    } else if (d.type === 'cache-done'){
      offlineState('All ' + d.stored + ' clips saved. This works with the wifi off.');
      $('#setCache').disabled = false;
      $('#setCache').textContent = 'Saved. Tap to check again';
    }
  });
} else {
  offlineState('This browser has no service worker, so nothing is saved for offline.');
}

$('#setCache').addEventListener('click', () => {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw){ offlineState('Not ready yet. Reload once, then try again.'); return; }
  $('#setCache').disabled = true;
  offlineState('Starting… this is about 86MB, give it a few minutes.');
  sw.postMessage({type:'cache-clips'});
});

/* ====================== go ====================== */

loadCfg();
resetIdle();
</script>
