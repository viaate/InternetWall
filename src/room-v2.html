/* ---------------- now playing, and the clock behind it ---------------- */

const npEl = $('#np'), npArt = $('#npArt'), npImg = $('#npImg');
const clTime = $('#clTime'), clAm = $('#clAm'), clDate = $('#clDate'), clDay = $('#clDay');
let artUrl = '';

/* mmss in the helpers rolls an hour into minutes, which turns a film into "104:12". */
const hms = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' +
         String(sec).padStart(2, '0');
};

/* Built once. Constructing an Intl formatter inside the tick is real work on an A14 and
   it happens every second for as long as the panel is awake. */
const H12 = new Intl.DateTimeFormat().resolvedOptions().hour12 !== false;
const fmtTime = new Intl.DateTimeFormat(undefined, {hour:'numeric', minute:'2-digit', hour12:H12});
const fmtDay  = new Intl.DateTimeFormat(undefined, {weekday:'long'});
const fmtDate = new Intl.DateTimeFormat(undefined, {day:'numeric', month:'long', year:'numeric'});

/* system-ui is SF Pro on the iPad and something wider everywhere else, so a fixed size
   either clips on one and looks timid on the other. Measured once per distinct time
   string, which is twice a day at most, not once a second. */
const clRow = document.querySelector('.rm-time');
let clFit = '';
function fitClock(){
  const sig = clTime.textContent.length + '/' + clAm.textContent.length;
  if (sig === clFit) return;
  const room = clRow.clientWidth;
  if (!room) return;                       // laid out but not shown yet, try again later
  clFit = sig;
  clRow.style.fontSize = '';
  const need = clRow.scrollWidth;
  if (need > room){
    const base = parseFloat(getComputedStyle(clRow).fontSize);
    clRow.style.fontSize = (base * room / need * .995).toFixed(1) + 'px';
  }
}

function paintClock(){
  const now = new Date();
  let t = fmtTime.format(now), ap = '';
  /* The meridiem is split off so the numerals can stay enormous and it can sit small
     beside them, instead of dragging the whole line down a size to fit. */
  const m = t.match(/\s*([AaPp]\.?\s?[Mm]\.?)$/);
  if (m){ ap = m[1].replace(/[.\s]/g, '').toUpperCase(); t = t.slice(0, m.index); }
  clTime.textContent = t.trim();
  clAm.textContent = ap;
  clDay.textContent = fmtDay.format(now);
  clDate.textContent = fmtDate.format(now);
  fitClock();
}

let clockTimer = null;
function startClock(){
  paintClock();
  if (clockTimer) return;
  clockTimer = setInterval(() => {
    /* The only repeating timer in the file, and it retires itself the moment the panel
       goes idle. A wall nobody is looking at should not wake the CPU every second all
       night; wake() starts it again. */
    if (document.body.classList.contains('idle')){ stopClock(); return; }
    paintClock();
  }, 1000);
}
function stopClock(){ if (clockTimer){ clearInterval(clockTimer); clockTimer = null; } }

function paintNowPlaying(np){
  const on = !!(np && (np.title || np.artwork));
  npEl.classList.toggle('clock', !on);
  if (!on){ startClock(); return; }
  stopClock();
  $('#npTitle').textContent = np.title || '';
  $('#npSub').textContent = np.subtitle || '';
  $('#npFb').textContent = (np.title || '').trim().charAt(0).toUpperCase() || '♪';
  /* Only touch src when the URL actually changed, or every poll restarts the decode and
     the artwork visibly blinks. */
  const art = np.artwork || '';
  if (art !== artUrl){
    artUrl = art;
    if (art) npImg.src = art; else npImg.removeAttribute('src');
    npArt.classList.toggle('has', !!art);
  }
  const dur = Math.max(0, +np.duration || 0);
  const pos = Math.max(0, Math.min(+np.position || 0, dur || Infinity));
  $('#npFill').style.transform = 'scaleX(' + (dur ? (pos / dur).toFixed(4) : 0) + ')';
  $('#npPos').textContent = dur ? hms(pos) : '';
  $('#npRem').textContent = dur ? '−' + hms(dur - pos) : '';
}
/* A bridge that hands over a dead artwork URL should fall back to the lettered sleeve
   rather than leave a broken image on the wall. */
npImg.addEventListener('error', () => { npArt.classList.remove('has'); artUrl = ''; });

/* Paint what is actually on. A panel that only offers buttons makes you press one to find
   out what was already happening, which is the thing every wall-panel guide warns about. */
function paintState(st){
  stateful.forEach(t => {
    const [kind, want] = t.dataset.state.split(':');
    let live = false;
    if (kind === 'input') live = !!(st && st.input === want);
    if (kind === 'tv') live = !!(st && (want === 'on' ? st.tv_on : st.muted));
    if (kind === 'pc') live = !!(st && st.pcs && st.pcs[want]);
    t.classList.toggle('live', live);
    const sub = t.querySelector('.rm-cap');
    if (sub && t.dataset.busy) sub.textContent = live ? t.dataset.busy : t.dataset.rest;
  });
  paintNowPlaying(st && st.now_playing);
}

/* ---------------- talking to the bridge ---------------- */

const bridgeEl = $('#bridgeState');
const bridgeTx = $('#bridgeText');
let bridgeUp = false;

function bridgeUrl(path){
  const base = (cfg.bridge || '').replace(/\/+$/, '');
  return base ? base + path : null;
}

function setBridge(up, text){
  bridgeUp = up;
  bridgeEl.className = 'rm-bridge ' + (up ? 'up' : 'down');
  bridgeTx.textContent = text;
  decksEl.querySelectorAll('.rm-seg, .rm-pc, .rm-key').forEach(b => { b.disabled = !up; });
}

async function pingBridge(){
  const u = bridgeUrl('/health');
  if (!u){ setBridge(false, 'no bridge address set. Long-press the wall to add one.'); return; }
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch(u, {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(t);
    const j = await r.json();
    setBridge(true, j.devices ? j.devices.join(' · ') : 'bridge up');
    paintState(j.state);
  } catch (e) {
    setBridge(false, 'bridge not answering');
  }
}

let sending = false;
async function send(device, action, btn){
  if (!bridgeUp || sending) return;
  const u = bridgeUrl('/cmd');
  if (!u) return;
  sending = true;
  btn.classList.add('on');
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(u, {method:'POST', signal: ctl.signal,
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({device, action})});
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    setBridge(false, 'that command did not go through');
    setTimeout(pingBridge, 1500);
  } finally {
    sending = false;
    setTimeout(() => btn.classList.remove('on'), 160);
  }
}

/* ---------------- pages ---------------- */

const pagesEl = $('#pages');
const pageEls = [...document.querySelectorAll('.page')];
let page = 0;

function setPage(n){
  page = Math.max(0, Math.min(pageEls.length - 1, n));
  pagesEl.style.setProperty('--page', page);
  pageEls.forEach((el2, i) => el2.classList.toggle('here', i === page));
  document.querySelectorAll('#dots button').forEach((b, i) =>
    b.classList.toggle('on', i === page));
  /* The clock only ticks while the page holding it is on screen. */
  if (page === 1){ pingBridge(); if (npEl.classList.contains('clock')) startClock(); }
  else stopClock();
  resetIdle();
}
document.querySelectorAll('#dots button').forEach(b =>
  b.addEventListener('click', () => setPage(+b.dataset.page)));
/* setPage is NOT called here. It calls resetIdle(), and idleTimer is a `let` declared
   further down, so running it at this point dies in the temporal dead zone. It is called
   from the boot block at the end instead, once everything exists. */

/* ====================== looking around ======================
   Drag anywhere on the wall and the camera leans. It springs back on release, because
   this is a wall, not a viewer: it should always settle to square-on so it goes back to
   pretending it is not a screen.

   The threshold is what keeps this from breaking tapping. Without it every tap would
   land as a one-pixel drag and then fire a story on release, or worse, a story would
   open at the end of a deliberate drag. Past 10px it is a drag and the click that
   follows is swallowed. */

const scene = $('#scene');
const stage = $('#stage');
const MAX_TILT = 7;          // degrees. More than this and the illusion breaks down.
const DRAG_PX = 10;

let dragFrom = null, dragging = false, swallowClick = false, swiping = false;
const SWIPE_PX = 55;        // past this, a horizontal drag is a page change

function setTilt(rx, ry){
  scene.style.setProperty('--rx', rx.toFixed(2) + 'deg');
  scene.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  /* Moving the vanishing point as well as rotating is what sells it as the viewer
     moving rather than the wall spinning on a spindle. */
  stage.style.setProperty('--px', (-ry * 5).toFixed(1) + 'px');
  stage.style.setProperty('--py', (rx * 5).toFixed(1) + 'px');
}

function tiltStart(e){
  /* Clear it here rather than trusting the click to arrive. A drag that ends off-screen,
     or on an element that never emits a click, would otherwise leave the flag armed and
     silently eat whichever real tap came next. A new gesture always starts clean. */
  swallowClick = false;
  if (document.body.classList.contains('story-open')) return;
  if (idle) return;                       // the first touch is for waking up
  dragFrom = {x:e.clientX, y:e.clientY};
  dragging = false;
  swiping = false;
}

function tiltMove(e){
  if (!dragFrom) return;
  const dx = e.clientX - dragFrom.x;
  const dy = e.clientY - dragFrom.y;

  /* A decidedly sideways drag is a page change, not a lean. Requiring it to be 1.4 times
     more horizontal than vertical is what stops a diagonal look-around from flipping the
     page out from under you. Once it is a swipe it stays one for the rest of the gesture,
     so the wall does not lurch between the two behaviours mid-drag. */
  if (!swiping && Math.abs(dx) > SWIPE_PX && Math.abs(dx) > Math.abs(dy) * 1.4){
    swiping = true;
    dragging = false;
    scene.classList.remove('dragging');
    setTilt(0, 0);
  }
  if (swiping) return;

  if (!dragging){
    if (Math.hypot(dx, dy) < DRAG_PX) return;
    dragging = true;
    scene.classList.add('dragging');
  }
  const clamp = v => Math.max(-MAX_TILT, Math.min(MAX_TILT, v));
  /* Divisors are half the panel, so a drag from the middle to an edge reaches full tilt. */
  setTilt(clamp(dy / (innerHeight / 2) * -MAX_TILT),
          clamp(dx / (innerWidth / 2) * MAX_TILT));
}

function tiltEnd(e){
  if (swiping && dragFrom && e){
    const dx = e.clientX - dragFrom.x;
    setPage(page + (dx < 0 ? 1 : -1));
  }
  if (dragging || swiping) swallowClick = true;   // a look or a swipe, not a tap
  dragFrom = null;
  dragging = false;
  swiping = false;
  scene.classList.remove('dragging');
  setTilt(0, 0);
}

stage.addEventListener('pointerdown', tiltStart);
addEventListener('pointermove', tiltMove, {passive:true});
addEventListener('pointerup', tiltEnd);
addEventListener('pointercancel', tiltEnd);

/* Capture, so it is stopped before it reaches whichever piece is underneath. */
addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* ====================== idle ====================== */

let idleTimer = null;
let idle = false;

function goIdle(){
  if (idle) return;
  idle = true;
  closeStory();
  document.body.classList.add('idle');
}
function wake(){
  idle = false;
  document.body.classList.remove('idle');
  resetIdle();
  /* The clock retired itself when the panel went idle, so waking has to hire it back. */
  if (page === 1 && npEl.classList.contains('clock')) startClock();
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(goIdle, cfg.idleMin * 60 * 1000);
}

/* The tap that wakes the wall must not also open whatever it landed on, or every
   wake would fire a story at somebody who was only walking past. Capture phase,
   so it is swallowed before it reaches the piece. */
document.addEventListener('pointerdown', e => {
  if (idle){
    e.stopPropagation();
    e.preventDefault();
    wake();
    return;
  }
  resetIdle();
}, true);
['pointermove','wheel','keydown','touchstart'].forEach(t =>
  document.addEventListener(t, () => { if (!idle) resetIdle(); }, {passive:true}));

/* ====================== settings, on a long press ====================== */

let pressTimer = null;
let pressFrom = null;

/* A finger resting on glass is never still: iOS emits a stream of pointermove events with
   a pixel or two of jitter the whole time it is down. Cancelling on any movement at all
   therefore killed the timer within milliseconds and the long press could never complete.
   It worked under a mouse, which emits nothing while held, which is exactly why this got
   through: the input device used to test it was the one device the bug does not affect. */
const PRESS_SLOP = 14;      // px of wander allowed before it counts as a drag
const PRESS_MS = 1100;

function armLongPress(e){
  /* Only on bare wall, so it can never be reached by mashing a picture. #plane covers the
     whole panel above #wall, so in practice that is the usual target; #stage and #scene
     are here too because a tilt can put either of them under the finger. */
  /* Adding the pager put #page-wall between the wall and the finger, so taps on bare
     drywall started landing on an element that was not in this list and long-press broke
     a second time. Matching by prefix as well means a new page cannot silently break it
     again. */
  const id = e.target.id || '';
  const bare = ['wall', 'plane', 'stage', 'scene', 'dim'].includes(id) ||
               id.startsWith('page-');
  if (!bare) return;
  pressFrom = {x: e.clientX, y: e.clientY};
  clearTimeout(pressTimer);
  pressTimer = setTimeout(openSettings, PRESS_MS);
}

function pressMove(e){
  if (!pressFrom) return;
  if (Math.hypot(e.clientX - pressFrom.x, e.clientY - pressFrom.y) > PRESS_SLOP) disarm();
}

function disarm(){ clearTimeout(pressTimer); pressFrom = null; }

document.addEventListener('pointerdown', armLongPress);
document.addEventListener('pointermove', pressMove, {passive: true});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, disarm));

function openSettings(){
  if (idle){ idle = false; document.body.classList.remove('idle'); }
  $('#setColor').value = cfg.wall;
  $('#setColorVal').textContent = cfg.wall.toUpperCase();
  $('#setBridge').value = cfg.bridge || '';
  $('#setDim').value = cfg.dim;
  $('#setDimVal').textContent = cfg.dim + '%';
  $('#setIdle').value = cfg.idleMin;
  $('#setIdleVal').textContent = cfg.idleMin + ' min';
  markSwatch();
  $('#settings').classList.add('on');
  $('#scrim').classList.add('on');
}
function closeSettings(){
  $('#settings').classList.remove('on');
  $('#scrim').classList.remove('on');
  document.body.classList.remove('idle');
  saveCfg();
  resetIdle();
}

const swBox = $('#swatches');
SWATCHES.forEach(([hex, name]) => {
  const b = el('button', 'sw');
  b.style.background = hex;
  b.dataset.hex = hex;
  b.title = name;
  b.addEventListener('click', () => {
    cfg.wall = hex;
    applyCfg();
    $('#setColor').value = hex;
    $('#setColorVal').textContent = hex.toUpperCase();
    $('#swName').textContent = name;
    markSwatch();
  });
  swBox.appendChild(b);
});
function markSwatch(){
  let found = '';
  swBox.querySelectorAll('.sw').forEach(b => {
    const hit = b.dataset.hex.toLowerCase() === cfg.wall.toLowerCase();
    b.classList.toggle('on', hit);
    if (hit) found = b.title;
  });
  $('#swName').textContent = found;
}

$('#setColor').addEventListener('input', e => {
  cfg.wall = e.target.value; applyCfg();
  $('#setColorVal').textContent = cfg.wall.toUpperCase();
  markSwatch();
});
$('#setBridge').addEventListener('change', e => {
  cfg.bridge = e.target.value.trim();
  saveCfg();
  pingBridge();
});
$('#setDim').addEventListener('input', e => {
  cfg.dim = +e.target.value; applyCfg();
  $('#setDimVal').textContent = cfg.dim + '%';
});
$('#setIdle').addEventListener('input', e => {
  cfg.idleMin = +e.target.value;
  $('#setIdleVal').textContent = cfg.idleMin + ' min';
});
$('#setPreview').addEventListener('click', () => {
  /* Show the idle state behind the panel so the dim level can be judged against
     the actual wall next to the iPad, which is the only way to get it right. */
  document.body.classList.toggle('idle');
});
$('#setReset').addEventListener('click', () => {
  cfg = Object.assign({}, DEFAULTS); applyCfg(); openSettings();
});
$('#setDone').addEventListener('click', closeSettings);
$('#scrim').addEventListener('click', closeSettings);

/* ====================== offline ====================== */

/* iOS only runs a service worker over HTTPS or on localhost. Served off a PC on the LAN
   over plain http it simply never registers, and everything else still works, so this
   reports what is actually true rather than promising offline it cannot deliver. */
let swReg = null;

function offlineState(msg){ const n = $('#offlineState'); if (n) n.textContent = msg; }

if ('serviceWorker' in navigator){
  /* Reload once when a new worker takes control, so a deploy actually lands. Without
     this the old page keeps running against the new worker until somebody happens to
     close and reopen the app, which on a wall-mounted iPad is never. */
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    reg.update();                       // check for a new build on every open
    offlineState('The wall and every photo are saved. Clips are saved as you play them.');
  }).catch(() => {
    offlineState('Could not register. Needs https, or localhost.');
    $('#setCache').disabled = true;
  });
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'cache-progress'){
      offlineState('Saving clip ' + d.done + ' of ' + d.total + '…');
    } else if (d.type === 'cache-done'){
      offlineState('All ' + d.stored + ' clips saved. This works with the wifi off.');
      $('#setCache').disabled = false;
      $('#setCache').textContent = 'Saved. Tap to check again';
    }
  });
} else {
  offlineState('This browser has no service worker, so nothing is saved for offline.');
}

/* The escape hatch. An early version of sw.js was cache-first on everything with a
   version string that never changed, so any device that installed it served that build
   for ever and no deploy could reach it. This tears the whole thing down by hand, which
   is the only fix from inside the app once a device is in that state. */
$('#setPurge').addEventListener('click', async () => {
  offlineState('Clearing…');
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e) {}
  location.reload(true);
});

$('#setCache').addEventListener('click', () => {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw){ offlineState('Not ready yet. Reload once, then try again.'); return; }
  $('#setCache').disabled = true;
  offlineState('Starting… this is about 86MB, give it a few minutes.');
  sw.postMessage({type:'cache-clips'});
});

/* ====================== go ====================== */

loadCfg();
setPage(0);
resetIdle();
</script>
</body>
</html>
